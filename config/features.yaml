# FabLens Feature 설정
#
# 컬럼명은 원본 CSV 헤더에서 확인한 실제 값입니다.
# 아래 분류 중 "확인 완료"로 표시된 항목은 scripts/01_profile_raw.py 결과로 확정했고,
# 나머지는 초기 후보입니다. 근거는 docs/decisions/02_DECISION_LOG.md 참조.
status: partially_confirmed

# --- 분석 단위 키 (TD-001, 확인 완료: 1,981건 / 라벨과 1:1, 누락 0) ---
keys:
  wafer_id: WAFER_ID
  stage: STAGE

# --- 타깃 ---
target: AVG_REMOVAL_RATE

# --- 시간 정렬 기준 ---
# TIMESTAMP는 datetime이 아니라 초 단위 float입니다.
# 절대 시각으로 해석하지 않고 순서 정렬에만 사용합니다.
time_column: TIMESTAMP

# --- 제외 컬럼 (확인 완료) ---
excluded:
  # 전 row에서 값이 2 하나뿐인 상수 컬럼 (DL-20260720-003)
  - MACHINE_ID

# --- 조건 변수 (DL-20260720-002) ---
# CHAMBER는 wafer-stage 안에서 고정이 아니라 1->2->3 또는 4->5->6으로 순차 변합니다.
# 따라서 원본 CHAMBER를 categorical feature로 직접 쓰지 않고,
# 아래 chamber_group으로 변환해 사용합니다.
conditions:
  stage:
    column: STAGE
    values: [A, B]
  chamber_group:
    source_column: CHAMBER
    derivation: "그룹 내 CHAMBER 값 집합으로 판정"
    groups:
      G123: [1, 2, 3]   # 368건, 전부 STAGE A, MRR 138~163 대역
      G456: [4, 5, 6]   # 1,613건, STAGE A 798 + STAGE B 815, MRR 53~101 대역

# --- 역할 미확정 ---
# MACHINE_DATA는 의미가 확인되지 않았습니다. EDA 후 feature/metadata 판정.
undetermined:
  - MACHINE_DATA

# --- 집계 대상 센서 컬럼 후보 ---
sensor_candidates:
  usage:
    - USAGE_OF_BACKING_FILM
    - USAGE_OF_DRESSER
    - USAGE_OF_POLISHING_TABLE
    - USAGE_OF_DRESSER_TABLE
    - USAGE_OF_MEMBRANE
    - USAGE_OF_PRESSURIZED_SHEET
  pressure:
    - PRESSURIZED_CHAMBER_PRESSURE
    - MAIN_OUTER_AIR_BAG_PRESSURE
    - CENTER_AIR_BAG_PRESSURE
    - RETAINER_RING_PRESSURE
    - RIPPLE_AIR_BAG_PRESSURE
    - EDGE_AIR_BAG_PRESSURE
  slurry:
    - SLURRY_FLOW_LINE_A
    - SLURRY_FLOW_LINE_B
    - SLURRY_FLOW_LINE_C
  rotation:
    - WAFER_ROTATION
    - STAGE_ROTATION
    - HEAD_ROTATION
  status:
    - DRESSING_WATER_STATUS

# =====================================================================
# 여기부터는 Data & ML 담당(김민지)이 구현하며 확정하는 영역입니다.
# 위쪽(키/타깃/제외/조건 변수)은 팀 공통 기준이므로 임의로 바꾸지 않습니다.
# =====================================================================

# --- 집계 함수 (TD-003: 목표 30~60개 Feature) ---
aggregations:
  - mean
  - std
  - min
  - max
  - range      # max - min
  - slope      # 시간에 대한 1차 회귀 기울기
  - delta      # 마지막값 - 첫값

# --- 그룹 단위 파생 Feature ---
derived:
  process_time: true        # wafer-stage 지속 시간 (last_ts - first_ts)
  n_samples: true           # 그룹 내 row 수
  prev_wafer_diff: true     # 직전 wafer-stage 대비 변화량
  chamber_dwell_time: true  # chamber 값별 체류 시간 (DL-20260720-002)

# --- 타깃 이상치 제외 (DL-20260720-003) ---
# 물리적으로 불가능한 MRR 4건. 다음으로 큰 값이 162.6인데 4,129~4,326.
target_outliers:
  rule: "AVG_REMOVAL_RATE > 1000"
  expected_removed: 4
  note: "제외 건수가 4가 아니면 중단하고 원인을 확인합니다."

# --- 제외 규칙 ---
exclusion_rules:
  drop_constant: true       # 전체에서 unique 값이 1개인 센서 제거
  constant_threshold: 1
  # 상관계수가 이 값을 넘는 쌍은 뒤에 오는 쪽을 제거합니다 (DL-20260720-006)
  correlation_threshold: 0.95
  # Leakage 후보: 타깃/미래 정보를 포함할 수 있는 컬럼. 미판정.
  leakage_suspects: []
