[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fablens"
version = "0.1.0"
description = "Virtual Metrology and SPC decision-support project for public CMP data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=16.0",
    "PyYAML>=6.0,<7.0",
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<4.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<0.14",
    "shap>=0.45,<1.0",
    "streamlit>=1.36,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

